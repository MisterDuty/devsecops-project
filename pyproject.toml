[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-project"
version = "0.1.0"
description = "A DevSecOps Flask task API with CI/CD, scanning, and Kubernetes deployment manifests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask==3.1.3",
    "Flask-Limiter==3.8.0",
    "Flask-SQLAlchemy==3.1.1",
    "Flask-Talisman==1.1.0",
    "gunicorn==26.0.0",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
